<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" style="background:#F8FAFC; font-family:'Segoe UI', Inter, sans-serif;">
  <!-- Browser Window Frame -->
  <rect x="0" y="0" width="1000" height="40" fill="#E2E8F0"/>
  <circle cx="20" cy="20" r="6" fill="#EF4444"/>
  <circle cx="40" cy="20" r="6" fill="#F59E0B"/>
  <circle cx="60" cy="20" r="6" fill="#10B981"/>
  <rect x="90" y="8" width="800" height="24" rx="4" fill="#FFFFFF"/>
  <text x="105" y="24" fill="#64748B" font-size="12">http://127.0.0.1:5500/index.html#reservas - EcoFlow Suite (Ecotrack Manager)</text>

  <!-- Sidebar (Left 220px) -->
  <rect x="0" y="40" width="220" height="610" fill="#1B4D3E"/>
  <rect x="15" y="55" width="30" height="30" rx="4" fill="#0284C7"/>
  <text x="23" y="75" fill="#FFFFFF" font-size="14" font-weight="bold">EF</text>
  <text x="55" y="75" fill="#FFFFFF" font-size="14" font-weight="bold">EcoFlow Suite</text>

  <!-- Active Sidebar Nav Item -->
  <rect x="10" y="150" width="200" height="36" rx="6" fill="#0284C7"/>
  <text x="25" y="173" fill="#FFFFFF" font-size="12" font-weight="bold">📝 P2: Cotización &amp; Reservas</text>
  <text x="25" y="210" fill="#CBD5E1" font-size="12">🧭 P3: Salidas &amp; Guías</text>
  <text x="25" y="240" fill="#CBD5E1" font-size="12">🎒 P4: Inventario QR</text>
  <text x="25" y="270" fill="#CBD5E1" font-size="12">📋 P6: Check-in de Campo</text>

  <!-- Main Content Area -->
  <rect x="220" y="40" width="780" height="50" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="250" y="72" fill="#0F172A" font-size="17" font-weight="bold">P2: Cotización y Registro de Reservas (RF-03)</text>
  <rect x="830" y="53" width="140" height="24" rx="12" fill="#DCFCE7"/>
  <text x="840" y="69" fill="#166534" font-size="11" font-weight="bold">● API: localhost:3000</text>

  <!-- Card Form Container -->
  <g transform="translate(250, 110)">
    <rect width="720" height="500" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>

    <!-- ERROR BANNER (409 CONFLICT) -->
    <rect x="20" y="20" width="680" height="90" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
    <circle cx="45" cy="50" r="14" fill="#EF4444"/>
    <text x="40" y="55" fill="#FFFFFF" font-size="16" font-weight="bold">!</text>
    <text x="70" y="45" fill="#991B1B" font-size="14" font-weight="bold">[RESERVA_CAPACIDAD_EXCEDIDA]: Capacidad máxima excedida (HTTP 409 Conflict)</text>
    <text x="70" y="68" fill="#B91C1C" font-size="12">No hay suficientes cupos disponibles en la fecha seleccionada (2026-11-20). Aforo máximo: 16, cupos restantes: 14.</text>
    <text x="70" y="90" fill="#7F1D1D" font-size="11" font-weight="600">• cantidad_pasajeros: Cupos disponibles: 14. Solicitados: 25.</text>

    <!-- Form Fields Mockup -->
    <text x="20" y="140" fill="#0F172A" font-size="12" font-weight="bold">Tour Seleccionado:</text>
    <rect x="20" y="150" width="320" height="36" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="30" y="173" fill="#0F172A" font-size="12">Rafting Cañón del Río Colca Clase IV ($85 USD)</text>

    <text x="370" y="140" fill="#0F172A" font-size="12" font-weight="bold">Fecha del Tour:</text>
    <rect x="370" y="150" width="330" height="36" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="380" y="173" fill="#0F172A" font-size="12">2026-11-20</text>

    <text x="20" y="215" fill="#0F172A" font-size="12" font-weight="bold">Cantidad de Pasajeros solicitada:</text>
    <rect x="20" y="225" width="320" height="36" rx="4" fill="#FFF1F2" stroke="#EF4444" stroke-width="2"/>
    <text x="30" y="248" fill="#EF4444" font-size="13" font-weight="bold">25 (EXCEDE AFORO DE 16)</text>

    <text x="370" y="215" fill="#0F172A" font-size="12" font-weight="bold">Titular de Reserva:</text>
    <rect x="370" y="225" width="330" height="36" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="380" y="248" fill="#0F172A" font-size="12">Andrea Salas Morales (andrea.salas@gmail.com)</text>

    <!-- Calculation Preview Box -->
    <rect x="20" y="290" width="680" height="60" rx="6" fill="#F1F5F9"/>
    <text x="35" y="315" fill="#64748B" font-size="11">Total Cotizado en Pantalla:</text>
    <text x="35" y="338" fill="#1B4D3E" font-size="18" font-weight="bold">$2,125.00 USD (25 pasajeros)</text>

    <rect x="470" y="302" width="210" height="36" rx="6" fill="#94A3B8"/>
    <text x="495" y="325" fill="#FFFFFF" font-size="12" font-weight="bold">Confirmar y Guardar Reserva</text>

    <!-- Table of existing reservations -->
    <text x="20" y="385" fill="#0F172A" font-size="14" font-weight="bold">Reservas Activas que consumen aforo:</text>
    <rect x="20" y="400" width="680" height="75" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="35" y="425" fill="#0F172A" font-size="11" font-weight="bold">RES-2026-001 | Rafting Colca | 2 pax | $170.00 | Estado: CONFIRMADA ✓</text>
    <text x="35" y="450" fill="#64748B" font-size="11">Aforo consumido: 2/16 pax. Aforo restante disponible: 14 pax.</text>
  </g>
</svg>
